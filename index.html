<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TSUTAYA BOOKSTORE MARUNOUCHI｜店舗コンテンツ</title>
  <meta name="theme-color" content="#2b211a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Shippori+Mincho:wght@700;800&family=Montserrat:wght@600&family=Fredoka:wght@600&family=Playfair+Display:ital,wght@1,500&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 20px;
      background: #F2EFEA;
      color: #2E2621;
      font-family: "Noto Sans JP", system-ui, sans-serif;
      line-height: 1.7;
    }
    .head { text-align: center; margin-bottom: 32px; }
    .head p { margin: 0; font-family: "Jost", sans-serif; font-weight: 500; letter-spacing: .28em; font-size: 12px; color: #8B6A4A; }
    .head h1 { margin: 6px 0 0; font-family: "Jost", sans-serif; font-weight: 600; letter-spacing: .14em; font-size: 15px; }
    .list { display: grid; gap: 18px; width: 100%; max-width: 1240px; margin: 0 auto; }
    @media (min-width: 680px) { .list { grid-template-columns: 1fr 1fr; max-width: 820px; } }
    @media (min-width: 1000px) { .list { grid-template-columns: repeat(3, 1fr); max-width: 1100px; } }
    a.card {
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      background: #FFFDF9;
      box-shadow: 0 6px 24px rgba(70, 48, 30, .1);
      transition: transform .2s, box-shadow .2s;
    }
    a.card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(70, 48, 30, .16); }
    a.card:focus-visible { outline: 3px solid #C8102E; outline-offset: 3px; }
    .card__img { aspect-ratio: 16 / 9; background: #D9D4CD center / cover no-repeat; }
    .card__body { padding: 18px 20px 20px; }
    .card__en { margin: 0; font-size: 12px; letter-spacing: .2em; color: #8B6A4A; font-family: "Jost", sans-serif; }
    .card__title { margin: 2px 0 0; font-size: 20px; font-weight: 900; }
    .card__sub { margin: 2px 0 0; font-size: 14px; color: #6B5E54; font-weight: 500; }
    .card--seminar .card__img { background-image: linear-gradient(rgba(20,14,10,.35), rgba(20,14,10,.35)), url("coffee-seminar/images/hero.jpg"); }
    .card--xmas .card__img {
      position: relative;
      display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 35%, #6a2424 0%, #3a1616 60%, #1f0c0c 100%);
      color: #fff;
    }
    .card--xmas .card__img svg { width: 64px; height: 64px; opacity: .9; }
    .card--xmas .card__img::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(#fff 1.2px, transparent 1.8px) 0 0 / 28px 28px, radial-gradient(#fff 1px, transparent 1.6px) 14px 14px / 28px 28px;
      opacity: .35;
    }
    .card--xmas .card__en { color: #C9A45C; font-family: "Playfair Display", Georgia, serif; font-style: italic; letter-spacing: .08em; }
    .card--quick .card__img {
      display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 40%, rgba(168,32,43,.3), transparent 65%), #2A1A17;
    }
    .card--quick .card__img svg { width: 110px; height: 74px; }
    .card--quick .card__en { color: #A8202B; font-family: "Shippori Mincho", serif; letter-spacing: .06em; font-weight: 700; }
    .card--quick .card__title { font-family: "Shippori Mincho", serif; font-weight: 800; font-size: 18px; line-height: 1.5; word-break: keep-all; }
    .card--iced { background: #F7F9FB; }
    .card--iced .card__img {
      display: grid; place-items: center;
      background: linear-gradient(160deg, #DCE7EF 0%, #BFD3E1 55%, #A9C3D6 100%);
    }
    .card--iced .card__img svg { width: 64px; height: 64px; }
    .card--iced .card__en { color: #3A7CA5; font-family: "Montserrat", "Jost", sans-serif; font-weight: 600; }
    .card--iced .card__title { color: #1F3A5F; }
    .card--halloween { background: #F3EFE6; }
    .card--halloween .card__img { background-image: url("halloween-blend/images/jack-o-lantern.jpg"); background-position: center 40%; }
    .card--halloween .card__en { color: #B5383A; font-family: "Fredoka", sans-serif; letter-spacing: .08em; }
    .card--halloween .card__title { color: #1E4620; font-family: "Fredoka", "Noto Sans JP", sans-serif; font-weight: 600; letter-spacing: .02em; }
  </style>
</head>
<body>
  <header class="head">
    <p>STARBUCKS COFFEE</p>
    <h1>TSUTAYA BOOKSTORE MARUNOUCHI</h1>
  </header>
  <main class="list">
    <a class="card card--seminar" href="coffee-seminar/">
      <div class="card__img"></div>
      <div class="card__body">
        <p class="card__en">COFFEE SEMINAR</p>
        <p class="card__title">コーヒーセミナー</p>
        <p class="card__sub">コーヒーを始めよう編</p>
      </div>
    </a>
    <a class="card card--xmas" href="christmas-seminar/">
      <div class="card__img">
        <svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M24 4v40M6.7 14l34.6 20M6.7 34l34.6-20"/><path d="M18 8l6 5 6-5M18 40l6-5 6 5M7 21.5l7.5-2.8L13 11M41 26.5l-7.5 2.8L35 37M7 26.5l7.5 2.8L13 37M41 21.5l-7.5-2.8L35 11"/></g></svg>
      </div>
      <div class="card__body">
        <p class="card__en">Coffee Seminar</p>
        <p class="card__title">コーヒーセミナー</p>
        <p class="card__sub">クリスマス編</p>
      </div>
    </a>
    <a class="card card--quick" href="xmas-quick-seminar/">
      <div class="card__img">
        <svg viewBox="0 0 96 64" aria-hidden="true">
          <path d="M46 34C36 18 18 12 4 16c6 4 4 10 10 12-4 4 0 8 6 8-2 6 4 8 10 6 2 6 10 6 16-8z" fill="#2F5D46"/>
          <path d="M50 34c10-16 28-22 42-18-6 4-4 10-10 12 4 4 0 8-6 8 2 6-4 8-10 6-2 6-10 6-16-8z" fill="#3D7558"/>
          <circle cx="44" cy="40" r="7" fill="#A8202B"/><circle cx="54" cy="42" r="7" fill="#8A1A23"/><circle cx="49" cy="33" r="7" fill="#C02A36"/>
        </svg>
      </div>
      <div class="card__body">
        <p class="card__en">Christmas Food Pairing Event</p>
        <p class="card__title">クリスマス ブレンド × クランベリー ブリス バー</p>
        <p class="card__sub">30分</p>
      </div>
    </a>
    <a class="card card--iced" href="iced-coffee-seminar/">
      <div class="card__img">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="8" y="10" width="22" height="22" rx="5" fill="#fff" fill-opacity=".7" stroke="#fff" stroke-width="2" transform="rotate(-10 19 21)"/>
          <rect x="20" y="20" width="20" height="20" rx="5" fill="#fff" fill-opacity=".55" stroke="#fff" stroke-width="2" transform="rotate(12 30 30)"/>
          <path d="M13 15l6-3M26 26l4-2" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="card__body">
        <p class="card__en">COFFEE SEMINAR</p>
        <p class="card__title">コーヒーセミナー</p>
        <p class="card__sub">アイスコーヒー編</p>
      </div>
    </a>
    <a class="card card--halloween" href="halloween-blend/">
      <div class="card__img"></div>
      <div class="card__body">
        <p class="card__en">HALLOWEEN BLEND</p>
        <p class="card__title">MARUNOUCHI HALLOWEEN BLEND</p>
        <p class="card__sub">バリスタが考えた、ハロウィン特別ブレンド</p>
      </div>
    </a>
  </main>
</body>
</html>
